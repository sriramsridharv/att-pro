name: Deploy to Streamlit Cloud

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Streamlit app
        run: |
          python -m py_compile app.py dashboard/scanner.py dashboard/indicators.py dashboard/portfolio.py dashboard/reports.py dashboard/settings.py

      - name: Streamlit Cloud deployment reminder
        run: |
          echo "The repository is ready for Streamlit Cloud deployment."
